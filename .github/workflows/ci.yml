name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: build example
        run: go build ./examples/...
  docker-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: for f in docker/mt5/*.sh scripts/*.sh docker/mt5/test/*.sh; do bash -n "$f" || exit 1; done
      - name: container helper tests
        run: for t in docker/mt5/test/*_test.sh; do bash "$t" || exit 1; done
